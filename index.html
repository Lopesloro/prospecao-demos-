<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Demonstrações</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,'Segoe UI',sans-serif;background:#fbfaf7;color:#22302e;line-height:1.6;padding:clamp(24px,6vw,64px)}
.container{max-width:640px;margin-inline:auto}
h1{font-size:clamp(1.6rem,4vw,2.2rem);margin-bottom:8px}
p.sub{color:#5c6b68;margin-bottom:36px}
ul{list-style:none;display:grid;gap:12px}
a{display:block;padding:18px 22px;background:#fff;border:1px solid #e6e2d8;border-radius:14px;
  text-decoration:none;color:inherit;font-weight:600;transition:border-color .15s}
a:hover{border-color:#0e7568;color:#0e7568}
footer{margin-top:40px;font-size:.85rem;color:#5c6b68}
</style>
</head>
<body>
<div class="container">
<h1>Demonstrações</h1>
<p class="sub">Versões demonstrativas de página inicial.</p>
<ul>
  <li><a href="./maisfamiliaclinica/">Clínica Odontológica Mais Família</a></li>
</ul>
<footer>Páginas demonstrativas, preparadas para apresentação.</footer>

</html>
